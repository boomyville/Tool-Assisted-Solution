<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DIY Companion — Hi-fi Prototype (converted)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>

  <!-- React + Babel (Babel used to transpile JSX loaded from app.js) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Load WebLLM as an ES module and expose to window -->
  <script type="module">
    const WEBLLM_URLS = [
      "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm",
      "https://esm.run/@mlc-ai/web-llm@0.2.79?bundle",
      "https://esm.sh/@mlc-ai/web-llm@0.2.79?bundle",
    ];

    window.mlcReady = (async () => {
      let lastErr = null;
      for (const url of WEBLLM_URLS) {
        try {
          console.log("[init] Trying WebLLM source:", url);
          const webllm = await import(url);
          if (!webllm || typeof webllm.CreateMLCEngine !== "function") {
            throw new Error("CreateMLCEngine missing from module exports");
          }
          window.mlc = webllm;
          window.mlcSourceUrl = url;
          console.log("[init] WebLLM loaded globally from:", url);
          return webllm;
        } catch (err) {
          lastErr = err;
          console.error("[init] WebLLM source failed:", url, err);
        }
      }

      window.mlcLoadError = lastErr || new Error("Unable to load WebLLM from all configured sources.");
      throw window.mlcLoadError;
    })();
  </script>

  <!-- Single app bundle (contains original JSX sources concatenated). -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
